<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nightmast Studio — Open After Dark</title>
<meta name="description" content="Nightmast Studio is an independent creative studio in Hobart. Brands, websites, packaging and content that glow after dark.">
<meta name="theme-color" content="#050819">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{
  --night:#050819;
  --night-2:#0d1440;
  --glass:rgba(160,176,255,.12);
  --glass-line:rgba(190,205,255,.22);
  --text:#e9ecff;
  --muted:rgba(220,226,255,.62);
  --gutter:22px;
  --side:56px;
  --radius:30px;
  --sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --serif:"Instrument Serif",Georgia,serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --script:"Yellowtail",cursive;
  /* page tokens, overwritten per page */
  --pg:#a4d65e; --ink:#1f3d10; --pg-soft:rgba(255,255,255,.22); --pg-line:rgba(31,61,16,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--night);color:var(--text);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 100%,#1b1650 0%,#070b22 55%,#03050f 100%);transition:opacity .9s ease,visibility .9s}
#loader.done{opacity:0;visibility:hidden}
.ld{display:flex;flex-direction:column;align-items:center;gap:14px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ld .pct{font-family:var(--serif);font-style:italic;font-size:54px;letter-spacing:0;color:var(--text);text-transform:none}
.ld .bar{width:160px;height:2px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
.ld .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9fb0ff,#ffd84a);transition:width .2s}

/* ---------- hero chrome ---------- */
.hud{position:fixed;inset:0;z-index:10;pointer-events:none;transition:opacity .5s ease}
.hud.hide{opacity:0}
.hud.hide *{pointer-events:none!important}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px 0}
.ic{pointer-events:auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .25s,transform .25s}
.ic:hover{background:rgba(170,186,255,.24);transform:translateY(-1px)}
.ic svg{width:18px;height:18px}
.ic.plain{background:none;border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.ic.on{background:rgba(255,216,74,.2);border-color:rgba(255,216,74,.5)}
.right{display:flex;gap:8px;align-items:center}
.logo{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none}
.logo svg{width:44px;height:44px;filter:drop-shadow(0 0 10px rgba(255,140,210,.55))}
.hints{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px}
.pill{font-size:11px;letter-spacing:.02em;padding:7px 12px;border-radius:99px;background:rgba(10,16,48,.55);border:1px solid var(--glass-line);color:var(--muted);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap}
.corner{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);line-height:1.6}
.corner.l{left:20px}
.corner.r{right:20px;text-align:right}
.corner b{color:var(--text);font-weight:500}
#tip{position:fixed;z-index:12;left:0;top:0;pointer-events:none;padding:7px 12px;border-radius:99px;font-size:11.5px;font-weight:500;color:#141414;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.35);opacity:0;transform:translate(-50%,-50%) scale(.85);transition:opacity .18s,transform .18s;white-space:nowrap}
#tip.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ---------- menu sheet ---------- */
#menu{position:fixed;z-index:40;top:calc(62px + env(safe-area-inset-top));left:18px;width:min(300px,calc(100vw - 36px));padding:10px;border-radius:22px;background:rgba(12,18,52,.82);border:1px solid var(--glass-line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,.45);opacity:0;transform:translateY(-8px) scale(.98);transform-origin:top left;pointer-events:none;transition:opacity .25s,transform .25s}
#menu.open{opacity:1;transform:none;pointer-events:auto}
#menu .mh{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:8px 10px 10px}
#menu button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 10px;border-radius:14px;text-align:left;font-size:15px;color:var(--text);transition:background .2s}
#menu button:hover{background:rgba(255,255,255,.07)}
#menu button i{width:14px;height:14px;border-radius:5px;flex:none;box-shadow:0 0 12px currentColor}
#menu button span{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)}

/* ---------- page card ---------- */
#card{position:fixed;z-index:30;left:50%;top:var(--gutter);width:min(960px,calc(100vw - var(--side)*2));height:calc(100dvh - var(--gutter)*2);transform:translateX(-50%);border-radius:var(--radius);background:var(--pg);color:var(--ink);opacity:0;visibility:hidden;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.45)}
#card.vis{opacity:1;visibility:visible}
#card.fade{transition:opacity .16s linear}
.card-head{position:absolute;z-index:3;left:0;right:0;top:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:linear-gradient(var(--pg) 62%,transparent);}
.card-head .ic{background:var(--pg-soft);border-color:var(--pg-line);color:var(--ink);backdrop-filter:none;-webkit-backdrop-filter:none}
.card-head .l{display:flex;align-items:center;gap:12px}
.crumb{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.card-head .logo{top:10px}
.card-head .logo svg{filter:none}
.back{pointer-events:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:9px 14px;border-radius:99px;background:var(--pg-soft);border:1px solid var(--pg-line);color:var(--ink);transition:background .2s}
.back:hover{background:var(--ink);color:var(--pg)}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:96px clamp(20px,5vw,64px) 64px;scrollbar-width:thin;scrollbar-color:var(--ink) transparent}
.scroller::-webkit-scrollbar{width:4px}
.scroller::-webkit-scrollbar-thumb{background:var(--ink);border-radius:4px}

/* reveal */
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--d,0) * 70ms)}
#card.show .rv{opacity:1;transform:none}
#card.hide-content .rv{opacity:0;transform:translateY(-8px);transition-duration:.25s;transition-delay:0s}

/* typography inside pages */
.pg h1.big{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(44px,6vw,76px);line-height:1;letter-spacing:-.01em}
.pg .kick{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.75;margin-bottom:14px}
.pg h2{font-weight:400;font-size:clamp(28px,3.4vw,44px);line-height:1.08;letter-spacing:-.02em}
.pg h2 em,.pg h3 em{font-family:var(--serif);font-style:italic;font-size:1.08em;letter-spacing:0}
.pg h3{font-weight:500;font-size:19px;line-height:1.25;letter-spacing:-.01em}
.pg p{font-size:15px;line-height:1.6;max-width:62ch}
.pg p.sm{font-size:13px;opacity:.82}
.sec{padding:44px 0;border-top:1px solid var(--pg-line)}
.sec:first-child{border-top:0;padding-top:0}
.row2{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:start}
.stack>*+*{margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border-radius:12px;background:var(--ink);color:var(--pg);font-size:14px;font-weight:500;text-decoration:none;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.18)}
.btn.round{border-radius:99px}
.lnk{font-size:14px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.lnk:hover{text-decoration-thickness:2px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--pg-soft);border:1px solid var(--pg-line);border-radius:18px;padding:22px}
.tile h3{margin-bottom:10px}
.tile p{font-size:14px}
.tile .lnk{display:inline-block;margin-top:16px}
.tile .note{display:block;margin-top:6px;font-size:12px;opacity:.7}
.mt{margin-top:28px}
.art{border-radius:18px;overflow:hidden;background:#0b1030;aspect-ratio:4/5;position:relative}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.cap{font-size:12.5px;margin-top:10px;opacity:.8}

/* pricing */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 30px}
.tab{padding:9px 15px;border-radius:99px;border:1px solid var(--pg-line);font-size:13px;background:var(--pg-soft);transition:background .2s,color .2s}
.tab[aria-selected="true"]{background:var(--ink);color:var(--pg);border-color:var(--ink)}
.price{display:flex;flex-direction:column;min-height:230px}
.price .p{font-size:22px;letter-spacing:-.02em;margin:10px 0 12px}
.price .ch{margin-top:auto;padding-top:14px;border-top:1px solid var(--pg-line);display:flex;justify-content:space-between;align-items:center;font-size:13px;width:100%;text-align:left}
.price.sel{background:var(--ink);color:var(--pg)}
.price.sel .ch{border-color:rgba(255,255,255,.25)}
.price .ch b{font-weight:400;font-size:18px;transition:transform .25s}
.price.sel .ch b{transform:rotate(45deg)}
.chosen{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chosen span{font-size:12.5px;padding:7px 12px;border-radius:99px;background:var(--ink);color:var(--pg)}
.fit{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}

/* services */
.svc{border-top:1px solid var(--pg-line)}
.svc:last-child{border-bottom:1px solid var(--pg-line)}
.svc>button{width:100%;display:grid;grid-template-columns:56px 1fr 28px;align-items:center;padding:22px 0;text-align:left}
.svc .n{font-family:var(--mono);font-size:12px;opacity:.7}
.svc .t{font-size:clamp(22px,2.6vw,32px);letter-spacing:-.02em}
.svc .pm{font-size:22px;transition:transform .3s;justify-self:end}
.svc.open .pm{transform:rotate(45deg)}
.svc .bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.8,.2,1)}
.svc.open .bd{grid-template-rows:1fr}
.svc .bd>div{overflow:hidden}
.svc .in{display:grid;grid-template-columns:56px 1fr 1fr;gap:24px;padding:0 0 26px}
.lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-bottom:6px}
.cover{aspect-ratio:16/10;border-radius:14px;overflow:hidden;position:relative;margin-bottom:14px;background:#0b1030}
.cover svg{position:absolute;inset:0;width:100%;height:100%}

/* contact */
.form{display:grid;gap:12px;max-width:560px}
.form input,.form textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--pg-soft);border:1px solid var(--pg-line);border-radius:12px;padding:14px 16px;outline:none}
.form input:focus,.form textarea:focus{border-color:var(--ink)}
.form ::placeholder{color:var(--ink);opacity:.55}
.thanks{display:none;font-family:var(--serif);font-style:italic;font-size:30px}
.form.sent{display:none}
.form.sent+.thanks{display:block}

/* ---------- mobile ---------- */
@media (max-width:820px){
  :root{--gutter:12px;--side:14px;--radius:24px}
  .row2,.g2,.g3{grid-template-columns:1fr}
  .row2{gap:22px}
  .svc .in{grid-template-columns:1fr;gap:16px}
  .svc>button{grid-template-columns:40px 1fr 24px}
  .crumb{display:none}
  .corner{display:none}
  .card-head{padding:0 10px}
  .card-head .logo svg{width:36px;height:36px}
  .back{padding:8px 11px;font-size:10px}
  .card-head .snd,.card-head .star{display:none}
  .scroller{padding:84px 20px 48px}
  .sec{padding:34px 0}
  .price{min-height:0}
}
@media (max-width:420px){
  .pill{font-size:10.5px;padding:6px 10px}
}
@media (prefers-reduced-motion:reduce){
  .rv{transition:opacity .3s!important;transform:none!important}
}
</style>
</head>

<canvas id="gl" tabindex="0" aria-label="A radio tower at night with a spinning ring of menu panels"></canvas>

<div id="tip"></div>

<nav id="menu" aria-label="Main">

</nav>

<section id="card" aria-modal="true" role="dialog" aria-label="Page">
  <header class="card-head">
    <div class="l">
      <button class="ic" data-cardmenu aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 8h14M5 12h14M5 16h14"/></svg></button>

    <a class="logo" href="#" aria-label="Back to tower" data-close></a>
    <div class="right">
      <button class="ic plain snd" aria-label="Toggle sound" data-sound></button>
      <button class="back" data-close>Back to tower</button>
    </div>
  </header>
  <div class="scroller" id="scroller"><div class="pg" id="pg"></div></div>
</section>

function logoSVG() {
  const px = [
    '....XXXX....', '..XXXX......', '.XXXX.......', '.XXX......*.', 'XXXX.....***',
    'XXXX......*.', 'XXXX........', 'XXXXX.......', '.XXXXX....XX', '.XXXXXXXXXX.',
    '..XXXXXXXX..', '....XXXX....'

  let r = '';
  px.forEach((row, y) => [...row].forEach((c, x) => {
    if (c === 'X') r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="#ff9ad5"/>`;
    if (c === '*') r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="#ffe27a"/>`;
  }));
  return `<svg viewBox="-1 -1 14 14" shape-rendering="crispEdges">${r}</svg>`;
}

/* ---------- code-drawn illustrations ---------- */
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function nightArt(seed, accent = '#ffd84a', alt = '#ff5c8d', kind = 0) {
  const R = rng(seed * 997 + 13);
  let stars = '';
  for (let i = 0; i < 46; i++) stars += `<circle cx="${(R() * 400).toFixed(1)}" cy="${(R() * 300).toFixed(1)}" r="${(R() * 1.3 + .3).toFixed(2)}" fill="#fff" opacity="${(R() * .7 + .3).toFixed(2)}"/>`;

  if (kind === 0) { // skyline with windows

      x += w + 2;
    }
  } else if (kind === 1) { // product bottles / candles
    for (let i = 0; i < 3; i++) {

      fg += `<rect x="${cx - 34}" y="${500 - h - 40}" width="68" height="${h}" rx="14" fill="${[accent, alt, '#94e6cc'][i]}"/>`;
      fg += `<rect x="${cx - 22}" y="${500 - h - 4}" width="44" height="40" rx="4" fill="#0a0f2e" opacity=".85"/>`;
      fg += `<path d="M${cx} ${500 - h - 64} q8 12 0 22 q-8 -10 0 -22z" fill="#ffe27a"/><circle cx="${cx}" cy="${500 - h - 50}" r="22" fill="#ffd84a" opacity=".18"/>`;
    }
    fg += `<rect x="0" y="460" width="400" height="40" fill="#0a0f2e"/>`;
  } else if (kind === 2) { // neon sign
    fg += `<rect x="40" y="200" width="320" height="170" rx="26" fill="none" stroke="${alt}" stroke-width="7" opacity=".95"/><rect x="40" y="200" width="320" height="170" rx="26" fill="none" stroke="${alt}" stroke-width="22" opacity=".18"/>`;

    fg += `<rect x="0" y="400" width="400" height="100" fill="#0a0f2e"/><rect x="280" y="210" width="6" height="190" fill="#1a2150"/><path d="M262 210h42l-8 -18h-26z" fill="#1a2150"/><circle cx="283" cy="214" r="70" fill="${accent}" opacity=".16"/><circle cx="283" cy="212" r="9" fill="#ffe9b0"/>`;
    fg += `<path d="M120 400v-92a26 26 0 0 1 52 0v92z" fill="#121a46"/><circle cx="146" cy="262" r="20" fill="#121a46"/><path d="M188 400v-84a24 24 0 0 1 48 0v84z" fill="#161f55"/><circle cx="212" cy="276" r="18" fill="#161f55"/>`;
    fg += `<path d="M120 330 h52" stroke="${alt}" stroke-width="3" opacity=".7"/>`;
  }
  return `<svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sk${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050819"/><stop offset=".6" stop-color="#151d55"/><stop offset="1" stop-color="#3a2468"/></linearGradient><radialGradient id="mg${seed}"><stop offset="0" stop-color="#fff6dd" stop-opacity=".55"/><stop offset="1" stop-color="#fff6dd" stop-opacity="0"/></radialGradient></defs><rect width="400" height="500" fill="url(#sk${seed})"/>${stars}<circle cx="${mx}" cy="${my}" r="70" fill="url(#mg${seed})"/><circle cx="${mx}" cy="${my}" r="20" fill="#f6f1e2"/><circle cx="${mx + 8}" cy="${my - 5}" r="18" fill="#0b1030" opacity=".9"/>${fg}</svg>`;
}

function renderPage(key) {
  const p = PAGES[key];
  const card = $('#card');
  card.style.setProperty('--pg', p.bg);
  card.style.setProperty('--ink', p.ink);
  card.style.setProperty('--pg-line', hexA(p.ink, .2));
  card.style.setProperty('--pg-soft', 'rgba(255,255,255,.24)');
  $('#crumb').textContent = p.label;
  card.setAttribute('aria-label', p.label);
  $('#pg').innerHTML = TPL[key](CONTENT[key]);
  $('#scroller').scrollTop = 0;
  if (key === 'pricing') wirePricing();
  if (key === 'services') $$('.svc>button').forEach(b => b.onclick = () => { const s = b.parentElement; s.classList.toggle('open'); b.setAttribute('aria-expanded', s.classList.contains('open')); });
  if (key === 'contact') $('#cform').onsubmit = e => { e.preventDefault(); e.target.classList.add('sent'); };
}
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function wirePricing() {
  const c = CONTENT.pricing, chosen = new Set();
  const body = $('#catBody');
  const draw = i => {
    const k = c.cats[i];
    body.innerHTML = `<h3 style="font-size:26px;font-weight:400">${esc(k.title)}</h3><p class="sm" style="margin:6px 0 18px">${esc(k.sub)}</p>
      <div class="grid g3">${k.items.map((it, j) => { const id = i + '-' + j; return `<div class="tile price ${chosen.has(id) ? 'sel' : ''}" data-id="${id}"><h3>${esc(it.n)}</h3><div class="p">${esc(it.p)}</div><p class="sm">${esc(it.d)}</p><button class="ch">Choose this <b>+</b></button></div>`; }).join('')}</div>`;
    $$('.price', body).forEach(el => el.querySelector('.ch').onclick = () => {
      const id = el.dataset.id; chosen.has(id) ? chosen.delete(id) : chosen.add(id); el.classList.toggle('sel'); drawChosen();
    });
  };
  const drawChosen = () => {
    const box = $('#chosen');
    box.innerHTML = chosen.size ? [...chosen].map(id => { const [a, b] = id.split('-'); const it = c.cats[a].items[b]; return `<span>${esc(it.n)} · ${esc(it.p)}</span>`; }).join('') : '<p class="sm">Nothing picked yet.</p>';
  };
  $$('.tab').forEach(t => t.onclick = () => { $$('.tab').forEach(x => x.setAttribute('aria-selected', x === t)); draw(+t.dataset.tab); });
  draw(0); drawChosen();
}

/* =====================================================================

const canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
const DPR = Math.min(devicePixelRatio || 1, isTouch ? 1.75 : 2);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NoToneMapping;   // keeps panel colours identical to the CSS page colours

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 3000);

const rt = new THREE.WebGLRenderTarget(innerWidth * DPR, innerHeight * DPR, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.setPixelRatio(DPR);
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), isTouch ? .45 : .55, .5, .9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const C = hex => new THREE.Color(hex);
const MOON_DIR = new THREE.Vector3(-0.4, 0.42, -1).normalize();

/* ---------- sky ---------- */
const NOISE_GLSL = `
float h3(vec3 p){ p = fract(p*0.3183099+.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float n3(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float a=.5, s=0.; for(int i=0;i<5;i++){ s+=a*n3(p); p*=2.03; a*=.5; } return s; }`;
function skyMaterial(boost = 1) {
  return new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: {
      cTop: { value: C('#03061a') }, cMid: { value: C('#0e1748') }, cHor: { value: C('#2c2468') }, cGlow: { value: C('#8a3f74') },
      uMoon: { value: MOON_DIR }, uBoost: { value: boost }
    },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `varying vec3 vDir; uniform vec3 cTop,cMid,cHor,cGlow,uMoon; uniform float uBoost; ${NOISE_GLSL}
      void main(){
        vec3 d = normalize(vDir); float e = d.y;
        vec3 col = mix(cHor, cMid, smoothstep(-0.04, 0.24, e));
        col = mix(col, cTop, smoothstep(0.2, 0.8, e));
        col = mix(col, cGlow, (1.0 - smoothstep(-0.12, 0.1, e)) * 0.75);
        // faint milky band
        float bd = dot(d, normalize(vec3(0.55, 0.35, 0.76)));
        float band = exp(-bd*bd*14.0) * smoothstep(0.0, 0.35, e);
        float neb = fbm(d*4.0 + 3.1);
        col += vec3(0.10,0.09,0.22) * band * (0.4 + neb) * 0.9;
        col += vec3(0.05,0.02,0.08) * smoothstep(.55,.9,fbm(d*2.2)) * smoothstep(0.05,0.4,e);
        // moon halo
        float m = max(dot(d, uMoon), 0.0);
        col += vec3(0.55,0.6,0.8) * (pow(m, 900.0)*0.0 + pow(m, 120.0)*0.25 + pow(m, 14.0)*0.05);
        gl_FragColor = vec4(col * uBoost, 1.0);
      }`
  });
}

function stripeTexture({ w = 1024, h = 128, base = '#8f9ab8', lines = 64, seams = 0, windows = 0, winColor = '#ffcf7a', seed = 1 } = {}) {
  const [c, x] = cnv(w, h), [ce, xe] = cnv(w, h), R = rng(seed);
  x.fillStyle = base; x.fillRect(0, 0, w, h);
  xe.fillStyle = '#000'; xe.fillRect(0, 0, w, h);
  for (let i = 0; i < lines; i++) {
    const px = i * w / lines;
    const g = x.createLinearGradient(px, 0, px + w / lines, 0);
    g.addColorStop(0, 'rgba(255,255,255,.28)'); g.addColorStop(.45, 'rgba(255,255,255,0)'); g.addColorStop(.92, 'rgba(0,0,0,.22)'); g.addColorStop(1, 'rgba(0,0,0,.45)');
    x.fillStyle = g; x.fillRect(px, 0, w / lines, h);
  }
  for (let s = 1; s <= seams; s++) { x.fillStyle = 'rgba(0,0,0,.35)'; x.fillRect(0, s * h / (seams + 1), w, 2); }
  for (let i = 0; i < windows; i++) {
    const cx = Math.floor(R() * lines) * w / lines + w / lines * .3, cy = (Math.floor(R() * (seams + 1)) + .35) * h / (seams + 1);
    const ww = w / lines * .4, hh = h / (seams + 1) * .3;
    x.fillStyle = '#2a2a36'; x.fillRect(cx, cy, ww, hh);
    xe.fillStyle = R() > .3 ? winColor : '#9fd0ff'; xe.globalAlpha = .5 + R() * .5; xe.fillRect(cx, cy, ww, hh); xe.globalAlpha = 1;
  }
  return [tex(c), tex(ce)];
}

function textBand(text, { bg, fg, font, repeat = 3, w = 2048, h = 128, sep = true, stroke }) {

  x.fillStyle = bg; x.fillRect(0, 0, w, h);

  const tw = x.measureText(text).width, n = Math.max(1, Math.floor(w / (tw + 60))), gap = (w - n * tw) / n;
  for (let i = 0; i < n; i++) {

    x.fillStyle = fg; x.fillText(text, px, h / 2 + 4);

/* ---------- panel geometry (grid → rounded rect → bent around tower) ---------- */
const PANEL = { R: 2.3, w: 3.12, h: 1.36, r: .2, t: .1, nx: 72, ny: 24 };
function panelFlat(w, h, r, t, nx = PANEL.nx, ny = PANEL.ny) {
  const nf = (nx + 1) * (ny + 1), L = 2 * nx + 2 * ny;
  const pos = new Float32Array((nf * 2 + L * 4) * 3);
  const P = (i, j) => {
    let x = -w / 2 + w * i / nx, y = -h / 2 + h * j / ny;
    const cx = Math.max(-w / 2 + r, Math.min(w / 2 - r, x)), cy = Math.max(-h / 2 + r, Math.min(h / 2 - r, y));
    const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy);
    if (d > r) { x = cx + dx / d * r; y = cy + dy / d * r; }
    return [x, y];
  };
  const grid = [];
  for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++) grid.push(P(i, j));
  grid.forEach(([x, y], k) => { pos.set([x, y, t / 2], k * 3); pos.set([x, y, -t / 2], (nf + k) * 3); });
  const loop = boundary(nx, ny);
  let o = nf * 2;
  for (let k = 0; k < L; k++) {
    const a = grid[loop[k]], b = grid[loop[(k + 1) % L]];
    pos.set([a[0], a[1], t / 2, b[0], b[1], t / 2, b[0], b[1], -t / 2, a[0], a[1], -t / 2], o * 3); o += 4;
  }
  return pos;
}
function boundary(nx, ny) {
  const id = (i, j) => j * (nx + 1) + i, L = [];
  for (let i = 0; i <= nx; i++) L.push(id(i, 0));
  for (let j = 1; j <= ny; j++) L.push(id(nx, j));
  for (let i = nx - 1; i >= 0; i--) L.push(id(i, ny));
  for (let j = ny - 1; j >= 1; j--) L.push(id(0, j));
  return L;
}
function panelGeometry() {
  const { w, h, r, t, nx, ny, R } = PANEL;
  const nf = (nx + 1) * (ny + 1), L = 2 * nx + 2 * ny;
  const flat = panelFlat(w, h, r, t);
  const bent = new Float32Array(flat.length);
  for (let k = 0; k < flat.length; k += 3) {
    const x = flat[k], y = flat[k + 1], z = flat[k + 2], a = x / R, rr = R + z;
    bent[k] = rr * Math.sin(a); bent[k + 1] = y; bent[k + 2] = rr * Math.cos(a) - R;
  }
  const uv = new Float32Array((nf * 2 + L * 4) * 2);
  for (let k = 0; k < nf; k++) {
    const u = (flat[k * 3] + w / 2) / w, v = (flat[k * 3 + 1] + h / 2) / h;
    uv.set([u, v], k * 2); uv.set([1 - u, v], (nf + k) * 2);
  }
  const idx = [];
  const id = (i, j) => j * (nx + 1) + i;
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const a = id(i, j), b = id(i + 1, j), c = id(i + 1, j + 1), d = id(i, j + 1);
    idx.push(a, b, d, b, c, d);
    idx.push(nf + a, nf + d, nf + b, nf + b, nf + d, nf + c);
  }
  const faceCount = idx.length;
  for (let k = 0; k < L; k++) { const o = nf * 2 + k * 4; idx.push(o, o + 2, o + 1, o, o + 3, o + 2); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(bent.slice(), 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.addGroup(0, faceCount, 0); g.addGroup(faceCount, idx.length - faceCount, 1);
  g.computeVertexNormals();
  g.userData = { flat, bent };
  return g;
}

/* panel material: lit texture that can melt into the flat, unlit page colour */
function panelMaterial(map, hex, side = false) {
  const solid = C(hex);
  const m = new THREE.MeshStandardMaterial({
    map: side ? null : map, color: side ? solid.clone().multiplyScalar(.7) : 0xffffff,
    emissiveMap: side ? null : map, emissive: side ? solid.clone().multiplyScalar(.25) : 0xffffff, emissiveIntensity: side ? 1 : .42,
    roughness: .5, metalness: 0, envMapIntensity: .5
  });
  m.userData.u = { uSolid: { value: solid }, uFlat: { value: 0 }, uGlow: { value: 0 } };
  m.onBeforeCompile = s => {
    Object.assign(s.uniforms, m.userData.u);
    s.fragmentShader = 'uniform vec3 uSolid; uniform float uFlat; uniform float uGlow;\n' + s.fragmentShader.replace('#include <dithering_fragment>',
      `#include <dithering_fragment>
       gl_FragColor.rgb += gl_FragColor.rgb * uGlow * 0.35;
       gl_FragColor.rgb = mix(gl_FragColor.rgb, uSolid, uFlat);`);
  };
  return m;
}

/* =====================================================================
   OPEN / CLOSE TRANSITION
   ===================================================================== */
const card = $('#card'), hud = $('#hud');
const FLY_OPEN = reduced ? .6 : 1.75, FLY_CLOSE = reduced ? .5 : 1.45;
let flight = null;

const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const sstep = (a, b, x) => { const t = THREE.MathUtils.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

function cardTarget() {
  // world-space rectangle in front of the *final* camera that exactly covers the DOM card
  const D = 5;
  const pose = cameraPose(1);
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const visH = 2 * D * tanH, px = visH / innerHeight;
  card.classList.add('measure');
  const r = card.getBoundingClientRect();
  const radius = parseFloat(getComputedStyle(card).borderRadius) || 28;
  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(pose.quat);
  const rightV = new THREE.Vector3(1, 0, 0).applyQuaternion(pose.quat);
  const upV = new THREE.Vector3(0, 1, 0).applyQuaternion(pose.quat);
  const offX = (r.left + r.width / 2 - innerWidth / 2) * px, offY = -(r.top + r.height / 2 - innerHeight / 2) * px;
  const pos = pose.pos.clone().addScaledVector(fwd, D).addScaledVector(rightV, offX).addScaledVector(upV, offY);
  const flat = panelFlat(r.width * px, r.height * px, Math.min(radius * px, r.height * px / 2), .015);
  return { pos, quat: pose.quat.clone(), flat, rightV, upV, fwd };
}

function homePose(p) {
  p.slot.updateWorldMatrix(true, false);
  const pos = new THREE.Vector3(), quat = new THREE.Quaternion();
  p.slot.getWorldPosition(pos); p.slot.getWorldQuaternion(quat);
  return { pos, quat };
}

function morph(p, b, g) {
  // b: bend amount (1 = wrapped on tower), g: grow toward page card
  const geo = p.mesh.geometry, arr = geo.attributes.position.array;
  const { flat, bent } = geo.userData, T = flight.target.flat;
  for (let k = 0; k < arr.length; k++) {
    const v = flat[k] + (bent[k] - flat[k]) * b;
    arr[k] = v + (T[k] - v) * g;
  }
  geo.attributes.position.needsUpdate = true;
  geo.computeVertexNormals();
  geo.computeBoundingSphere();
}

const tmpQ = new THREE.Quaternion(), twistQ = new THREE.Quaternion(), zAxis = new THREE.Vector3(0, 0, 1);
function poseFlight(s) {
  const p = flight.p, home = homePose(p), T = flight.target;
  const out = home.quat.clone(); const outward = new THREE.Vector3(0, 0, 1).applyQuaternion(out);
  const c1 = home.pos.clone().addScaledVector(outward, 3.2).add(new THREE.Vector3(0, 1.3, 0));
  const c2 = T.pos.clone().addScaledVector(T.rightV, 2.4).addScaledVector(T.upV, .9).addScaledVector(T.fwd, 2.2);
  const a = ease(s), ia = 1 - a;
  const pos = home.pos.clone().multiplyScalar(ia * ia * ia)
    .addScaledVector(c1, 3 * ia * ia * a).addScaledVector(c2, 3 * ia * a * a).addScaledVector(T.pos, a * a * a);
  p.mesh.parent !== scene && scene.attach(p.mesh);
  p.mesh.position.copy(pos);
  tmpQ.copy(home.quat).slerp(T.quat, sstep(.05, .85, s));
  twistQ.setFromAxisAngle(zAxis, Math.sin(Math.PI * s) * .35 * flight.side);
  p.mesh.quaternion.copy(tmpQ).multiply(twistQ);
  const sc = p.hiddenAtHome ? THREE.MathUtils.lerp(.25, 1, sstep(0, .25, s)) : 1;
  p.mesh.scale.setScalar(sc);
  morph(p, 1 - sstep(.06, .55, s), ease(sstep(.55, 1, s)));
  p.mats.forEach(m => m.userData.u.uFlat.value = sstep(.38, .82, s));
  rig.pan = ease(sstep(.12, .95, s));
}

function openPage(key) {
  if (state === 'open') { swapPage(key); return; }
  if (state !== 'idle') return;
  closeMenu();
  const p = panels[key];
  state = 'opening';
  setHover(null);
  hud.classList.add('hide');
  renderPage(key);
  p.mesh.position.set(0, 0, 0); p.hover = 0;
  p.mats.forEach(m => m.userData.u.uGlow.value = 0);
  p.mesh.visible = true;
  flight = { p, key, t: 0, dir: 1, side: Math.random() < .5 ? -1 : 1, target: cardTarget() };
  sfx.whoosh(1);
  if (location.hash !== '#' + key) history.pushState({ page: key }, '', '#' + key);
}

function finishOpen() {
  card.classList.remove('fade');
  card.classList.add('vis');
  flight.p.mesh.visible = false;
  state = 'open';
  canvas.style.cursor = 'zoom-out';
  requestAnimationFrame(() => card.classList.add('show'));
  setTimeout(() => $('#scroller').focus?.(), 50);
}

function closePage() {
  if (state !== 'open') return;
  state = 'closing';
  card.classList.add('hide-content');
  card.classList.remove('show');
  setTimeout(() => {
    flight.target = cardTarget();
    flight.t = 1; flight.dir = -1;
    poseFlight(1);
    flight.p.mesh.visible = true;
    card.classList.add('fade');
    card.classList.remove('vis');
    sfx.whoosh(-1);
  }, reduced ? 50 : 260);
}

function finishClose() {
  const p = flight.p;
  p.slot.attach(p.mesh);
  p.mesh.position.set(0, 0, 0); p.mesh.quaternion.identity(); p.mesh.scale.setScalar(1);
  const geo = p.mesh.geometry; geo.attributes.position.array.set(geo.userData.bent); geo.attributes.position.needsUpdate = true; geo.computeVertexNormals(); geo.computeBoundingSphere();
  p.mats.forEach(m => m.userData.u.uFlat.value = 0);
  if (p.hiddenAtHome) p.mesh.visible = false;
  card.classList.remove('hide-content', 'fade');
  hud.classList.remove('hide');
  flight = null; rig.pan = 0;
  state = 'idle';
  canvas.style.cursor = 'grab'; hovered = null;
  if (location.hash && !pendingOpen) history.replaceState(null, '', location.pathname + location.search);
  canvas.focus({ preventScroll: true });
}

function swapPage(key) {
  // while a page is open, jumping to another one closes back to the tower then opens the next
  closeMenu();
  history.replaceState(null, '', location.pathname + location.search);
  pendingOpen = key;
  closePage();
}
let pendingOpen = null;

function requestClose() {
  if (state !== 'open') return;
  if (history.state && history.state.page) history.back(); else closePage();
}
addEventListener('popstate', () => {
  const k = location.hash.slice(1);
  if (state === 'open' && (!k || !PAGES[k])) closePage();
  else if (state === 'idle' && PAGES[k]) openPage(k);
});
addEventListener('keydown', e => { if (e.key === 'Escape') { if (menu.classList.contains('open')) closeMenu(); else requestClose(); } });
document.addEventListener('click', e => {
  const c = e.target.closest('[data-close]'); if (c) { e.preventDefault(); requestClose(); return; }
  const o = e.target.closest('[data-open]'); if (o) { e.preventDefault(); openPage(o.dataset.open); return; }
  if (e.target.closest('[data-home]')) { e.preventDefault(); spinVel += 2.4; return; }
  if (e.target.closest('[data-star]')) { spawnShootingStar(); sfx.chime(); return; }
  if (e.target.closest('[data-sound]')) { sfx.toggle(); return; }
  if (e.target.closest('[data-cardmenu]') || e.target.closest('#menuBtn')) { e.stopPropagation(); toggleMenu(e.target.closest('button')); return; }
  if (!e.target.closest('#menu')) {
    const menuWasOpen = menu.classList.contains('open');
    closeMenu();
    // clicking anywhere outside the open page sends it back to the tower
    if (!menuWasOpen && state === 'open' && !e.target.closest('#card')) requestClose();
  }
});

/* menu sheet */
const menu = $('#menu');
['about', 'work', 'services', 'pricing', 'contact'].forEach((k, i) => {
  const b = document.createElement('button');
  b.innerHTML = `<i style="background:${PAGES[k].bg};color:${PAGES[k].bg}"></i>${PAGES[k].label}<span>0${i + 1}</span>`;
  b.onclick = () => openPage(k);
  menu.appendChild(b);
});
function toggleMenu(btn) {
  const open = !menu.classList.contains('open');
  menu.classList.toggle('open', open);
  $('#menuBtn').setAttribute('aria-expanded', open);
  menu.style.zIndex = state === 'open' ? 45 : 40;
  if (state === 'open') { const r = btn.getBoundingClientRect(); menu.style.top = (r.bottom + 10) + 'px'; menu.style.left = r.left + 'px'; }
  else { menu.style.top = ''; menu.style.left = ''; }
}
function closeMenu() { menu.classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', false); }

/* =====================================================================
   SOUND (WebAudio, all synthesised)
   ===================================================================== */
const sfx = (() => {
  let ctx, master, on = false, cricketTimer;
  function init() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520; lp.Q.value = .6; lp.connect(master);
    [55, 82.4, 110.2, 164.8].forEach((f, i) => {
      const o = ctx.createOscillator(); o.type = i % 2 ? 'triangle' : 'sine'; o.frequency.value = f; o.detune.value = (i - 1.5) * 6;
      const g = ctx.createGain(); g.gain.value = .06 / (i + 1); o.connect(g).connect(lp); o.start();
    });
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = .05; lg.gain.value = 260; lfo.connect(lg).connect(lp.frequency); lfo.start();
  }
  function chirp() {
    if (!on) return;
    const t = ctx.currentTime, pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    if (pan) { pan.pan.value = Math.random() * 1.6 - .8; pan.connect(master); }
    for (let i = 0; i < 3; i++) {
      const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 4300 + Math.random() * 300;
      g.gain.setValueAtTime(0, t + i * .07); g.gain.linearRampToValueAtTime(.018, t + i * .07 + .01); g.gain.linearRampToValueAtTime(0, t + i * .07 + .05);
      o.connect(g).connect(pan || master); o.start(t + i * .07); o.stop(t + i * .07 + .06);
    }
    cricketTimer = setTimeout(chirp, 600 + Math.random() * 1800);
  }
  return {
    toggle() {
      if (!ctx) init();
      on = !on; ctx.resume();
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.linearRampToValueAtTime(on ? .55 : 0, ctx.currentTime + .8);
      $$('[data-sound]').forEach(b => { b.innerHTML = on ? ICON_SOUND : ICON_MUTE; b.classList.toggle('on', on); });
      clearTimeout(cricketTimer); if (on) chirp();
    },
    whoosh(dir) {
      if (!on) return;
      const t = ctx.currentTime, len = 1.1, buf = ctx.createBuffer(1, ctx.sampleRate * len, ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const s = ctx.createBufferSource(); s.buffer = buf;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
      bp.frequency.setValueAtTime(dir > 0 ? 260 : 1800, t); bp.frequency.exponentialRampToValueAtTime(dir > 0 ? 1800 : 260, t + len);
      const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.22, t + .3); g.gain.linearRampToValueAtTime(0, t + len);
      s.connect(bp).connect(g).connect(master); s.start(t);
    },
    chime() {
      if (!on) return;
      const t = ctx.currentTime;
      [1318, 1760, 2637].forEach((f, i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f; g.gain.setValueAtTime(0, t + i * .08); g.gain.linearRampToValueAtTime(.05, t + i * .08 + .01); g.gain.exponentialRampToValueAtTime(.0001, t + i * .08 + 1.2); o.connect(g).connect(master); o.start(t + i * .08); o.stop(t + i * .08 + 1.3); });
    }
  };
})();

/* =====================================================================
   LOOP
   ===================================================================== */
const clock = new THREE.Clock();
let nextShoot = 4;
const tmpC = new THREE.Color();
function tick() {
  const dt = Math.min(clock.getDelta(), 1 / 20), t = clock.elapsedTime;

  // intro settle
  if (state === 'intro') { rig.intro = Math.max(0, rig.intro - dt * .55); if (rig.intro <= 0) { state = 'idle'; const k = location.hash.slice(1); if (PAGES[k]) openPage(k); } }
  const introE = ease(1 - rig.intro);

  // parallax (desktop only)
  const k = isTouch ? 0 : 1;
  rig.sx += ((rig.mx * k) - rig.sx) * Math.min(1, dt * 2.5);
  rig.sy += ((-rig.my * k) - rig.sy) * Math.min(1, dt * 2.5);

  // ring spin w/ inertia
  if (!drag) {
    const target = state === 'idle' || state === 'intro' ? IDLE_SPIN : 0.02;
    spinVel += (target - spinVel) * Math.min(1, dt * 1.6);
    spin += spinVel * dt;
  }
  ring.rotation.y = spin + (1 - introE) * -2.2;
  topBand.rotation.y = -t * .12;
  contactBand.material.map.offset.x = -t * .02;

  // hover lift
  RING_ORDER.forEach(key => {
    const p = panels[key];
    if (flight && flight.p === p) return;
    p.hoverT = hovered === key ? 1 : 0;
    p.hover += (p.hoverT - p.hover) * Math.min(1, dt * 8);
    p.mesh.position.z = p.hover * .16;
    p.mesh.scale.setScalar(1 + p.hover * .035);
    p.mats[0].userData.u.uGlow.value = p.hover;
  });
  contactBand.material.emissiveIntensity = .55 + (hovered === 'contact' ? .5 : 0) + Math.sin(t * 2) * .05;

  // antenna life
  halo.rotation.y = t * .9; halo.rotation.z = Math.sin(t * .6) * .12;
  dishPivot.rotation.y = Math.sin(t * .35) * 2.4;
  const blink = (Math.sin(t * 3.2) > .55) ? 1 : .08;
  beacon.material.color.setRGB(6 * blink + .4, .35 * blink, .25 * blink);
  beaconGlow.material.opacity = blink; beaconGlow.scale.setScalar(.9 + blink * .5);
  pulses.forEach(p => { const ph = (t * .38 + p.off) % 1; p.m.scale.setScalar(.12 + ph * 2.1); p.m.material.opacity = (1 - ph) * (1 - ph) * .5; });

  // chasing lights
  for (let i = 0; i < rimLights.count; i++) {
    const v = .25 + .75 * Math.pow(.5 + .5 * Math.sin(i * .55 - t * 4), 6);
    rimLights.setColorAt(i, tmpC.setRGB(v, v * .95, v * .85));
  }
  rimLights.instanceColor.needsUpdate = true;
  for (let i = 0; i < underLights.count; i++) { const v = .35 + .65 * (.5 + .5 * Math.sin(t * 1.5 + i)); underLights.setColorAt(i, tmpC.setRGB(v * .5, v * .9, v * 1.3)); }
  underLights.instanceColor.needsUpdate = true;

  // flight
  if (flight && (state === 'opening' || state === 'closing') && !(state === 'closing' && !flight.p.mesh.visible)) {
    flight.t = THREE.MathUtils.clamp(flight.t + flight.dir * dt / (flight.dir > 0 ? FLY_OPEN : FLY_CLOSE), 0, 1);
    poseFlight(flight.t);
    if (flight.dir > 0 && flight.t >= 1) finishOpen();
    else if (flight.dir < 0 && flight.t <= 0) { finishClose(); if (pendingOpen) { const k2 = pendingOpen; pendingOpen = null; openPage(k2); } }
  }

  // clouds drift
  clouds.forEach(c => { c.position.x += c.userData.v * dt; if (c.position.x > c.userData.x0 + 14) c.position.x = c.userData.x0 - 14; });

  // shooting stars
  nextShoot -= dt;
  if (nextShoot < 0) { spawnShootingStar(); nextShoot = 7 + Math.random() * 9; }
  for (let i = shooting.length - 1; i >= 0; i--) {
    const s = shooting[i]; s.t += dt;
    const arr = s.p.geometry.attributes.position.array;
    for (let j = 0; j < SHOOT_N; j++) {
      const tt = Math.max(0, s.t - j * .012);
      arr[j * 3] = s.head.x + s.vel.x * tt; arr[j * 3 + 1] = s.head.y + s.vel.y * tt; arr[j * 3 + 2] = s.head.z + s.vel.z * tt;
    }
    s.p.geometry.attributes.position.needsUpdate = true;
    s.p.material.uniforms.uLife.value = Math.sin(Math.min(1, s.t / s.life) * Math.PI);
    if (s.t > s.life) { skyGroup.remove(s.p); s.p.geometry.dispose(); s.p.material.dispose(); shooting.splice(i, 1); }
  }

  skyGroup.userData.starMat.uniforms.uTime.value = t;
  applyCamera();
  composer.render();
  requestAnimationFrame(tick);
}

/* =====================================================================
   RESIZE / CLOCK / BOOT
   ===================================================================== */
function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.fov = w < 700 ? 40 : 36;
  camera.updateProjectionMatrix();
  rig.dist = baseDistance();
  skyGroup.rotation.y = camera.aspect < .8 ? -.26 : 0;   // bring the moon into frame on portrait screens
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.resolution.set(w, h);
  $('#hint1').textContent = isTouch ? 'Swipe to spin' : 'Scroll to spin';
  $('#hint2').textContent = isTouch ? 'Tap to explore' : 'Click to explore';
}
addEventListener('resize', resize);

function updateClock() {
  try { $('#clock').textContent = new Intl.DateTimeFormat('en-AU', { hour: 'numeric', minute: '2-digit', timeZone: 'Australia/Hobart' }).format(new Date()); } catch (e) { }
}
setInterval(updateClock, 15000); updateClock();

async function boot() {
  const pct = $('.ld .pct'), bar = $('.ld .bar i');
  let shown = 0;
  const step = to => new Promise(r => { const iv = setInterval(() => { shown = Math.min(to, shown + 3); pct.textContent = shown + '%'; bar.style.width = shown + '%'; if (shown >= to) { clearInterval(iv); r(); } }, 16); });
  const fontsReady = Promise.race([
    Promise.all(['230px Yellowtail', '170px Anton', '500 76px Inter', '600 78px Inter', '500 15px "DM Mono"', 'italic 40px "Instrument Serif"'].map(f => document.fonts.load(f))),
    new Promise(r => setTimeout(r, 3500))
  ]);
  await Promise.all([step(60), fontsReady]);
  buildTowerDetails();
  rimLights = lightRing(44, 1.84, 1.9, .028);
  underLights = lightRing(28, 1.9, -1.66, .03);
  buildAntenna();
  buildShaft();
  await buildPanels();
  resize();
  await step(100);
  applyCamera();
  canvas.style.cursor = 'grab';
  tick();
  setTimeout(() => $('#loader').classList.add('done'), 150);
}
boot();
</script>
